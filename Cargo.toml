[package]
name = "valolysis-desktop"
version = "0.3.0"
edition = "2024"
description = "Valolysis tray service: watches VALORANT replay downloads and uploads them"

[[bin]]
name = "valolysis"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
log = "0.4"
notify = { version = "8.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
